<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Certified Architect — Study Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #F7F3ED;
  --cream-dark: #EDE7DD;
  --ink: #1A1612;
  --ink-light: #3D362E;
  --ink-faded: #6B6158;
  --vermillion: #C4432A;
  --vermillion-light: rgba(196,67,42,0.1);
  --vermillion-glow: rgba(196,67,42,0.15);
  --green: #2A8C5A;
  --green-light: rgba(42,140,90,0.1);
  --border: #E5DED5;
  --card-bg: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(26,22,18,0.06);
  --shadow-md: 0 4px 16px rgba(26,22,18,0.08);
  --shadow-hover: 0 8px 28px rgba(26,22,18,0.12);
  --radius: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --d1: #C4432A;
  --d2: #2A7BC4;
  --d3: #2A8C5A;
  --d4: #C4962A;
  --d5: #7B2AC4;
  --d1-bg: rgba(196,67,42,0.1);
  --d2-bg: rgba(42,123,196,0.1);
  --d3-bg: rgba(42,140,90,0.1);
  --d4-bg: rgba(196,150,42,0.1);
  --d5-bg: rgba(123,42,196,0.1);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  color: var(--ink);
  background: var(--cream);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; line-height: 1.2; }
h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
h2 { font-size: clamp(1.6rem, 4vw, 2.5rem); margin-bottom: 1.5rem; }
h3 { font-size: 1.3rem; }
p { color: var(--ink-light); }
a { color: var(--vermillion); text-decoration: none; transition: opacity 0.2s; }
a:hover { opacity: 0.8; }
a[target="_blank"]::after { content: " \2197"; font-size: 0.8em; }
a.start-quiz-btn::after, a.exam-cta-btn::after { content: none; }
code { background: var(--cream-dark); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: 'DM Mono', monospace; }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(247,243,237,0.85);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: box-shadow 0.3s;
}
.nav.scrolled { box-shadow: var(--shadow-md); }
.nav-inner {
  max-width: 1060px; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif; font-weight: 700;
  font-size: 1.1rem; letter-spacing: 0.02em; white-space: nowrap;
}
.nav-links { display: flex; gap: 4px; }
.nav-link {
  padding: 6px 14px; border-radius: var(--radius-pill);
  font-size: 0.85rem; font-weight: 500; color: var(--ink-faded);
  transition: all 0.2s; text-decoration: none;
}
.nav-link::after { content: none !important; }
.nav-link:hover { color: var(--ink); background: var(--cream-dark); }
.nav-link.active { color: var(--vermillion); background: var(--vermillion-light); }

/* Main */
main { max-width: 1060px; margin: 0 auto; padding: 0 24px; }
section { padding: 16px 0; }
.section-header { margin-bottom: 1rem; }
.section-subtitle { color: var(--ink-faded); font-size: 0.95rem; margin-top: 0.25rem; }

/* Cards */
.card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card-flat { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }

/* Domain Tags */
.domain-tag {
  display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
}
.domain-tag.d1 { background: var(--d1-bg); color: var(--d1); }
.domain-tag.d2 { background: var(--d2-bg); color: var(--d2); }
.domain-tag.d3 { background: var(--d3-bg); color: var(--d3); }
.domain-tag.d4 { background: var(--d4-bg); color: var(--d4); }
.domain-tag.d5 { background: var(--d5-bg); color: var(--d5); }

/* Badges */
.time-badge {
  display: inline-block; padding: 4px 12px; border-radius: var(--radius-pill);
  background: var(--cream-dark); color: var(--ink-faded);
  font-size: 0.8rem; font-weight: 500;
}

/* Dashboard */
.dash-hero { display: flex; align-items: center; }
.dash-hero-ring { flex: 0 0 25%; display: flex; justify-content: center; }
.dash-hero-stats-col { flex: 0 0 25%; display: flex; flex-direction: column; gap: 10px; padding: 0 12px; }
.dash-hero-stat { display: flex; flex-direction: column; }
.dash-hero-val { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 700; color: var(--vermillion); }
.dash-hero-label { font-size: 0.75rem; color: var(--ink-faded); }
.dash-hero-right { flex: 0 0 50%; min-width: 0; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.dash-full { grid-column: 1 / -1; }
.stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
.stat-item { flex: 1; min-width: 140px; text-align: center; padding: 20px; }
.stat-value { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--vermillion); }
.stat-label { font-size: 0.8rem; color: var(--ink-faded); margin-top: 4px; }

.progress-ring-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.progress-ring-container { position: relative; width: 160px; height: 160px; }
.progress-ring-container svg { transform: rotate(-90deg); }
.progress-ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
.progress-ring-fill { fill: none; stroke: var(--vermillion); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
.progress-ring-text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.progress-pct { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; font-weight: 700; color: var(--ink); }
.progress-label { font-size: 0.75rem; color: var(--ink-faded); }

.domain-bars { display: flex; flex-direction: column; gap: 12px; }
.domain-bar-row { display: flex; align-items: center; gap: 12px; }
.domain-bar-label { width: 200px; font-size: 0.82rem; font-weight: 500; flex-shrink: 0; }
.domain-bar-track { flex: 1; height: 8px; background: var(--cream-dark); border-radius: 4px; overflow: hidden; }
.domain-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.domain-bar-pct { width: 36px; font-size: 0.8rem; color: var(--ink-faded); text-align: right; }

.quiz-score-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
.quiz-score-item { text-align: center; padding: 10px 4px; border-radius: var(--radius); background: var(--cream); }
.quiz-score-domain { font-size: 0.7rem; font-weight: 600; margin-bottom: 4px; }
.quiz-score-val { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; }
.quiz-score-na { color: var(--ink-faded); font-size: 0.75rem; }

.start-quiz-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px; border-radius: var(--radius-pill);
  background: var(--vermillion); color: white;
  font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.3s;
}
.start-quiz-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(196,67,42,0.3); }
.start-quiz-btn:disabled { background: var(--border); color: var(--ink-faded); cursor: not-allowed; transform: none; box-shadow: none; }

/* Study Plan */
.study-cards { display: flex; flex-direction: column; gap: 20px; }
.study-card { position: relative; }
.study-card.completed { border-left: 3px solid var(--green); }
.study-card.completed .study-card-title { text-decoration: line-through; color: var(--ink-faded); }
.study-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.study-card-left { display: flex; align-items: center; gap: 12px; }
.study-checkbox {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
  cursor: pointer; appearance: none; -webkit-appearance: none;
  transition: all 0.2s; flex-shrink: 0; position: relative; margin-top: 2px;
}
.study-checkbox:checked { background: var(--green); border-color: var(--green); }
.study-checkbox:checked::after {
  content: '\2713'; position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center;
  color: white; font-size: 14px; font-weight: 700;
}
.study-card-title { font-size: 1.2rem; }
.study-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.study-tasks { font-size: 0.8rem; color: var(--ink-faded); margin-bottom: 12px; }

.study-details { margin-top: 12px; }
.study-details summary {
  font-weight: 600; font-size: 0.85rem; color: var(--vermillion);
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
}
.study-details summary::before { content: '\25B6'; font-size: 0.65rem; transition: transform 0.2s; }
.study-details[open] summary::before { transform: rotate(90deg); }
.study-details ul { margin-top: 10px; padding-left: 20px; }
.study-details li { font-size: 0.85rem; color: var(--ink-light); margin-bottom: 6px; line-height: 1.5; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: all 0.2s; display: flex; align-items: flex-start; gap: 8px; list-style: none; }
.study-details li::before { content: '○'; flex-shrink: 0; font-size: 0.75rem; margin-top: 2px; color: var(--border); transition: all 0.2s; }
.study-details li.learned { color: var(--ink-faded); text-decoration: line-through; text-decoration-color: var(--border); }
.study-details li.learned::before { content: '●'; color: var(--green); }
.study-details li:hover { background: var(--cream); }
.study-details ul { padding-left: 0; }
.study-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.study-link {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 14px; border-radius: var(--radius-pill);
  background: var(--vermillion-light); color: var(--vermillion);
  font-size: 0.8rem; font-weight: 500; transition: background 0.2s;
}
.study-link:hover { background: var(--vermillion-glow); opacity: 1; }
.study-link.in-progress { background: var(--d4-bg); color: var(--d4); }
.study-link.in-progress:hover { background: rgba(196,150,42,0.18); opacity: 1; }
.study-link.done { background: var(--green-light); color: var(--green); }
.study-link.done:hover { background: rgba(42,140,90,0.15); opacity: 1; }
.study-link-wrap { display: inline-flex; align-items: center; gap: 0; }
.link-status-dot {
  cursor: pointer; font-size: 0.9rem; padding: 5px 6px 5px 10px;
  border-radius: var(--radius-pill) 0 0 var(--radius-pill);
  background: var(--cream-dark); transition: all 0.2s; line-height: 1;
  border: 1px solid var(--border); border-right: none;
}
.link-status-dot:hover { background: var(--cream); }
.study-link-wrap .study-link { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }

/* Practice Questions */
.filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
.filter-tab {
  padding: 6px 16px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: transparent;
  font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500;
  color: var(--ink-faded); cursor: pointer; transition: all 0.2s;
}
.filter-tab:hover { border-color: var(--ink-faded); color: var(--ink); }
.filter-tab.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

.reset-btn {
  padding: 6px 16px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: transparent;
  font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500;
  color: var(--ink-faded); cursor: pointer; transition: all 0.2s;
  white-space: nowrap; align-self: center;
}
.reset-btn:hover { border-color: var(--vermillion); color: var(--vermillion); }

.questions-list { display: flex; flex-direction: column; gap: 24px; }
.question-card { transition: none; }
.question-card:hover { transform: none; }
.question-header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.scenario-tag {
  display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
  background: var(--cream-dark); color: var(--ink-faded);
  font-size: 0.75rem; font-weight: 500;
}
.question-num { font-size: 0.75rem; font-weight: 600; color: var(--ink-faded); margin-left: auto; }
.question-text { font-size: 0.95rem; color: var(--ink); line-height: 1.65; margin-bottom: 16px; }

.options-list { display: flex; flex-direction: column; gap: 8px; }
.option-btn {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--card-bg);
  cursor: pointer; text-align: left; transition: all 0.2s;
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem; line-height: 1.5; color: var(--ink-light);
}
.option-btn:hover:not(.disabled) { border-color: var(--vermillion); background: var(--vermillion-light); }
.option-letter {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
  background: var(--cream-dark); display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 0.82rem; color: var(--ink-faded);
}
.option-btn.correct { border-color: var(--green); background: var(--green-light); }
.option-btn.correct .option-letter { background: var(--green); color: white; }
.option-btn.incorrect { border-color: #C44; background: rgba(204,68,68,0.08); }
.option-btn.incorrect .option-letter { background: #C44; color: white; }
.option-btn.disabled { cursor: default; opacity: 0.7; }
.option-btn.disabled:hover { border-color: var(--border); background: var(--card-bg); }
.option-btn.correct.disabled { opacity: 1; }

.explanation {
  margin-top: 16px; padding: 16px; border-radius: var(--radius);
  background: var(--cream); border-left: 3px solid var(--green);
  font-size: 0.88rem; line-height: 1.6; color: var(--ink-light);
  display: none;
}
.explanation.visible { display: block; animation: fadeIn 0.3s ease; }
.explanation-label { font-weight: 600; color: var(--green); margin-bottom: 6px; }

/* Quiz Modal */
.quiz-modal {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--cream); overflow-y: auto;
  display: none; animation: fadeIn 0.3s ease;
}
.quiz-modal.active { display: block; }
.quiz-inner { max-width: 720px; margin: 0 auto; padding: 32px 24px; min-height: 100vh; display: flex; flex-direction: column; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
.quiz-progress-text { font-size: 0.85rem; color: var(--ink-faded); }
.quiz-score-text { font-size: 0.85rem; font-weight: 600; color: var(--vermillion); }
.quiz-close {
  padding: 6px 16px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: transparent;
  font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
  color: var(--ink-faded); cursor: pointer; transition: all 0.2s;
}
.quiz-close:hover { background: var(--cream-dark); }
.quiz-progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 32px; }
.quiz-progress-fill { height: 100%; background: var(--vermillion); border-radius: 2px; transition: width 0.4s ease; }
.quiz-next-btn {
  margin-top: 20px; padding: 10px 24px; border-radius: var(--radius-pill);
  background: var(--ink); color: var(--cream);
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
  border: none; cursor: pointer; transition: all 0.2s; display: none;
}
.quiz-next-btn.visible { display: inline-block; }
.quiz-next-btn:hover { opacity: 0.85; }

.quiz-results { text-align: center; padding: 40px 0; }
.quiz-results h2 { margin-bottom: 8px; }
.quiz-results-score { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; font-weight: 700; color: var(--vermillion); }
.quiz-results-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 24px 0; }
.quiz-results-item { padding: 16px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); }

/* Cheat Sheet */
.cheat-search {
  width: 100%; padding: 12px 20px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--card-bg);
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 24px;
}
.cheat-search:focus { outline: none; border-color: var(--vermillion); box-shadow: 0 0 0 3px var(--vermillion-light); }
.cheat-domains { display: flex; flex-direction: column; gap: 16px; }
.cheat-domain { border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--card-bg); overflow: hidden; }
.cheat-domain > summary {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; cursor: pointer; list-style: none; font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem; font-weight: 600; transition: background 0.2s;
}
.cheat-domain > summary:hover { background: var(--cream); }
.cheat-domain > summary::marker, .cheat-domain > summary::-webkit-details-marker { display: none; }
.cheat-domain > summary .arrow { transition: transform 0.2s; font-size: 0.8rem; color: var(--ink-faded); }
.cheat-domain[open] > summary .arrow { transform: rotate(90deg); }
.weight-badge {
  padding: 3px 10px; border-radius: var(--radius-pill);
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 600;
}
.cheat-content { padding: 0 24px 24px; }
.cheat-subsection { margin-bottom: 20px; }
.cheat-subsection h4 { font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
.cheat-subsection ul { padding-left: 18px; }
.cheat-subsection li { font-size: 0.85rem; color: var(--ink-light); margin-bottom: 5px; line-height: 1.55; }
.cheat-subsection li.highlight {
  border-left: 3px solid var(--vermillion); padding-left: 10px;
  margin-left: -18px; list-style: none; background: var(--vermillion-light);
  padding-top: 4px; padding-bottom: 4px; border-radius: 0 4px 4px 0;
}
.cheat-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
.cheat-table th { text-align: left; padding: 8px 12px; background: var(--cream); font-weight: 600; border-bottom: 2px solid var(--border); }
.cheat-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--ink-light); }

/* Patterns */
.patterns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pattern-card .pattern-num {
  font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700;
  color: var(--vermillion); opacity: 0.3; line-height: 1;
}
.pattern-card h3 { margin: 8px 0 2px; font-size: 1.15rem; }
.pattern-card .pattern-sub { font-size: 0.82rem; color: var(--ink-faded); font-style: italic; margin-bottom: 8px; }
.pattern-card p:last-child { font-size: 0.88rem; }

/* Scenarios */
.scenarios-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.scenario-card .scenario-num { font-size: 0.75rem; font-weight: 600; color: var(--ink-faded); text-transform: uppercase; letter-spacing: 0.05em; }
.scenario-card h3 { margin: 6px 0 10px; }
.scenario-card .scenario-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.scenario-card .scenario-concepts { font-size: 0.85rem; }
.scenario-note { text-align: center; color: var(--ink-faded); font-size: 0.85rem; margin-bottom: 20px; font-style: italic; }

/* FadeUp */
.fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
.fade-up.visible { opacity: 1; transform: translateY(0); }

/* Responsive */
@media (max-width: 768px) {
  .nav-links { gap: 2px; overflow-x: auto; }
  .nav-link { padding: 6px 10px; font-size: 0.78rem; white-space: nowrap; }
  .dash-hero { flex-direction: column; gap: 20px; }
  .dash-hero-ring, .dash-hero-stats-col, .dash-hero-right { flex: 1 1 100%; }
  .dash-hero-stats-col { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 16px; text-align: center; }
  .dash-grid { grid-template-columns: 1fr; }
  .patterns-grid, .scenarios-grid { grid-template-columns: 1fr; }
  .stat-row { flex-direction: column; }
  .quiz-score-grid { grid-template-columns: repeat(3, 1fr); }
  .domain-bar-label { width: 130px; font-size: 0.75rem; }
  section { padding: 24px 0; }
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.hidden { display: none !important; }

/* Password Gate */
.pw-gate {
  position: fixed; inset: 0; z-index: 2000;
  background: var(--cream);

// ===== HELPERS =====
function domainClass(d) { return d.toLowerCase(); }
function getUnlockedDomains() {
  const domains = new Set();
  STATE.completedDays.forEach(id => {
    const day = STUDY_DAYS.find(d => d.id === id);
    if (day) day.domains.forEach(d => domains.add(d));
  });
  return domains;
}
function getQuizQuestions() {
  const unlocked = getUnlockedDomains();
  return QUESTIONS.filter(q => unlocked.has(q.domain));
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        <details class="cheat-domain fade-up" open>
          <summary>
            <span>${dom.id}: ${dom.name}</span>
            <span style="display:flex;align-items:center;gap:8px">
              <span class="weight-badge" style="background:var(--${domainClass(dom.id)}-bg);color:var(--${domainClass(dom.id)})">${dom.weight}%</span>
              <span class="arrow">\u25B6</span>
            </span>
          </summary>
          <div class="cheat-content">
            ${dom.sections.map(sec => `
              <div class="cheat-subsection">
                <h4>${sec.title}</h4>
                ${sec.table ? `
                  <table class="cheat-table">
                    <thead><tr>${sec.table.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                    <tbody>${sec.table.rows.map(r => `<tr>${r.map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
                  </table>
                ` : ''}
                ${sec.items ? `<ul>${sec.items.map(it => `<li class="${it.hl ? 'highlight' : ''}">${escHtml(it.text)}</li>`).join('')}</ul>` : ''}
              </div>
            `).join('')}
          </div>
        </details>
      `).join('')}
    </div>
  `;
  initFadeUp();
}

function renderPatterns() {
  document.getElementById('patterns').innerHTML = `
    <div class="section-header fade-up"><h2>10 Key Exam Patterns</h2><p class="section-subtitle">The recurring decision rules the exam tests \u2014 know these cold</p></div>
    <div class="patterns-grid">
      ${EXAM_PATTERNS.map(p => `
        <div class="card pattern-card fade-up">
          <div class="pattern-num">${String(p.n).padStart(2,'0')}</div>
          <h3>${p.title}</h3>
          <div class="pattern-sub">${p.sub}</div>
          <p>${escHtml(p.desc)}</p>
        </div>
      `).join('')}
    </div>
  `;
  initFadeUp();
}

function renderScenarios() {
  document.getElementById('scenarios').innerHTML = `
    <div class="section-header fade-up"><h2>Exam Scenarios</h2><p class="section-subtitle">You'll see 4 of these 6 on the exam</p></div>
    <div class="scenario-note fade-up">Each scenario has a 67% chance of appearing on your exam sitting</div>
    <div class="scenarios-grid">
      ${SCENARIOS.map(s => `
        <div class="card scenario-card fade-up">
          <div class="scenario-num">Scenario ${s.id}</div>
          <h3>${s.name}</h3>
          <div class="scenario-tags">${s.domains.map(d => `<span class="domain-tag ${domainClass(d)}">${d}</span>`).join('')}</div>
          <p class="scenario-concepts">${escHtml(s.concepts)}</p>
        </div>
      `).join('')}
    </div>
  `;
  initFadeUp();
}

// ===== QUIZ =====
function resetAttempts() {
  STATE.attempts = {};
  save();
  renderPractice();
}

function startQuiz() {
  const qs = getQuizQuestions();
  if (qs.length === 0) return;
  STATE.quiz = { questions: shuffle(qs), index: 0, score: 0, answers: {} };
  renderQuizQuestion();
  document.getElementById('quiz-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeQuiz() {
  document.getElementById('quiz-modal').classList.remove('active');
  document.body.style.overflow = '';
  STATE.quiz = null;
  renderDashboard();
}
function renderQuizQuestion() {
  const q = STATE.quiz;
  if (q.index >= q.questions.length) { renderQuizResults(); return; }
  const question = q.questions[q.index];
  const answered = q.answers[question.id];
  document.getElementById('quiz-modal').innerHTML = `
    <div class="quiz-inner">
      <div class="quiz-header">
        <div>
          <span class="quiz-progress-text">Question ${q.index + 1} of ${q.questions.length}</span>
          <span class="quiz-score-text" style="margin-left:16px">Score: ${q.score}/${q.index}</span>
        </div>
        <button class="quiz-close" onclick="closeQuiz()">Exit Quiz</button>
      </div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(q.index / q.questions.length) * 100}%"></div></div>
      <div class="question-header" style="margin-bottom:14px">
        <span class="domain-tag ${domainClass(question.domain)}">${question.domain}</span>
        <span class="scenario-tag">${question.scenario}</span>
      </div>
      <div class="question-text" style="font-size:1rem;margin-bottom:20px">${escHtml(question.text)}</div>
      <div class="options-list">
        ${question.options.map(o => {
          let cls = 'option-btn';
          if (answered) {
            cls += ' disabled';
            if (o.letter === question.correct) cls += ' correct';
            else if (o.letter === answered) cls += ' incorrect';
          }
          return `<button class="${cls}" onclick="quizAnswer(${question.id},'${o.letter}')" ${answered ? 'disabled' : ''}>
            <span class="option-letter">${o.letter}</span>
            <span>${escHtml(o.text)}</span>
          </button>`;
        }).join('')}
      </div>
      ${answered ? `
        <div class="explanation visible" style="margin-top:16px">
          <div class="explanation-label">${answered === question.correct ? 'Correct! \u2713' : `Incorrect \u2014 Answer: ${question.correct}`}</div>
          <div>${escHtml(question.explanation)}</div>
        </div>
        <button class="quiz-next-btn visible" onclick="quizNext()" style="margin-top:16px">${q.index + 1 < q.questions.length ? 'Next Question \u2192' : 'See Results'}</button>
      ` : ''}
    </div>
  `;
}
function quizAnswer(qid, letter) {
  const q = STATE.quiz;
  if (q.answers[qid]) return;
  const question = q.questions[q.index];
  q.answers[qid] = letter;
  const correct = letter === question.correct;
  if (correct) q.score++;
  // Update quiz scores
  if (!STATE.quizScores[question.domain]) STATE.quizScores[question.domain] = {correct:0,total:0};
  STATE.quizScores[question.domain].total++;
  if (correct) STATE.quizScores[question.domain].correct++;
  save();
  renderQuizQuestion();
}
function quizNext() { STATE.quiz.index++; renderQuizQuestion(); }
function renderQuizResults() {
  const q = STATE.quiz;
  const byDomain = {};
  q.questions.forEach(question => {
    if (!byDomain[question.domain]) byDomain[question.domain] = {correct:0,total:0};
    byDomain[question.domain].total++;
    if (q.answers[question.id] === question.correct) byDomain[question.domain].correct++;
  });
  document.getElementById('quiz-modal').innerHTML = `
    <div class="quiz-inner">
      <div class="quiz-header">
        <div></div>
        <button class="quiz-close" onclick="closeQuiz()">Close</button>
      </div>
      <div class="quiz-results">
        <h2>Quiz Complete</h2>
        <div class="quiz-results-score">${q.score} / ${q.questions.length}</div>
        <p style="margin:8px 0 24px;color:var(--ink-faded)">${Math.round(q.score/q.questions.length*100)}% correct</p>
        <div class="quiz-results-breakdown">
          ${Object.entries(byDomain).map(([d, s]) => `
            <div class="quiz-results-item">
              <div class="quiz-score-domain" style="color:var(--${domainClass(d)})">${d}</div>
              <div class="quiz-score-val">${s.correct}/${s.total}</div>
            </div>
          `).join('')}
        </div>
        <button class="start-quiz-btn" onclick="closeQuiz()" style="margin-top:16px">Back to Dashboard</button>
      </div>
    </div>
  `;
}

// ===== EVENTS =====
document.addEventListener('click', e => {
  // Focus area learned toggle
  const learnItem = e.target.closest('li[data-learn]');
  if (learnItem) {
    const key = learnItem.dataset.learn;
    if (STATE.learnedItems[key]) delete STATE.learnedItems[key];
    else STATE.learnedItems[key] = true;
    learnItem.classList.toggle('learned');
    save();
    return;
  }
  // Resource link status cycle
  const dot = e.target.closest('.link-status-dot');
  if (dot) {
    e.preventDefault();
    const url = dot.dataset.cycle;
    const current = STATE.linkStatus[url] || '';
    const next = current === '' ? 'in-progress' : current === 'in-progress' ? 'done' : '';
    if (next) STATE.linkStatus[url] = next;
    else delete STATE.linkStatus[url];
    save();
    renderStudyPlan();
    return;
  }
  // Study day checkbox
  const cb = e.target.closest('.study-checkbox');
  if (cb) {
    const id = parseInt(cb.dataset.day);
    if (cb.checked) { if (!STATE.completedDays.includes(id)) STATE.completedDays.push(id); }
    else { STATE.completedDays = STATE.completedDays.filter(d => d !== id); }
    save();
    renderDashboard();
    renderStudyPlan();
    renderPractice();
    return;
  }
  // Practice question answer
  const opt = e.target.closest('.option-btn:not(.disabled)');
  if (opt && !opt.closest('.quiz-modal')) {
    const qid = parseInt(opt.dataset.qid);
    const letter = opt.dataset.letter;
    const q = QUESTIONS.find(x => x.id === qid);
    if (!q || STATE.attempts[qid]) return;
    STATE.attempts[qid] = { selected: letter, correct: letter === q.correct };
    save();
    renderPractice();
    return;
  }
  // Filter tabs
  const tab = e.target.closest('.filter-tab');
  if (tab) {
    STATE.filter = tab.dataset.filter;
    renderPractice();
    return;
  }
});

// Cheat sheet search
document.addEventListener('input', e => {
  if (e.target.id === 'cheat-search') {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll('.cheat-domain').forEach(dom => {
      let anyMatch = false;
      dom.querySelectorAll('.cheat-subsection').forEach(sub => {
        let subMatch = false;
        sub.querySelectorAll('li, td').forEach(item => {
          const match = !query || item.textContent.toLowerCase().includes(query);
          item.style.display = match ? '' : 'none';
          if (match) subMatch = true;
        });
        const title = sub.querySelector('h4');
        if (title) {
          const titleMatch = title.textContent.toLowerCase().includes(query);
          if (titleMatch) subMatch = true;
        }
        sub.style.display = subMatch ? '' : 'none';
        if (subMatch) anyMatch = true;
      });
      dom.style.display = anyMatch ? '' : 'none';
      if (anyMatch && query) dom.open = true;
    });
  }
});

// Nav active state
const sections = document.querySelectorAll('section');
const navLinks = document.querySelectorAll('.nav-link');
const navObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(l => l.classList.remove('active'));
      const link = document.querySelector(`.nav-link[href="#${entry.target.id}"]`);
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-40% 0px -40% 0px' });
sections.forEach(s => navObserver.observe(s));

// Nav scroll shadow
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
});

// Smooth scroll
document.querySelectorAll('.nav-link').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    const target = document.querySelector(link.getAttribute('href'));
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  });
});

// FadeUp
function initFadeUp() {
  document.querySelectorAll('.fade-up:not(.observed)').forEach(el => {
    el.classList.add('observed');
    fadeObserver.observe(el);
  });
}
const fadeObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      fadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

// ===== INIT =====
function init() {
  renderDashboard();
  renderStudyPlan();
  renderPractice();
  renderCheatSheet();
  renderPatterns();
  renderScenarios();
}
init();
</script>
</body>
